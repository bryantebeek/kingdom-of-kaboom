<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='28' cy='38' r='22' fill='%23191a22' stroke='%23e8c170' stroke-width='3'/><circle cx='20' cy='30' r='6' fill='%23ffffff' opacity='.25'/><rect x='32' y='12' width='12' height='9' rx='2' transform='rotate(40 38 16)' fill='%23e8c170'/><path d='M44 12 Q50 4 57 7' stroke='%23c9a36a' stroke-width='3' fill='none' stroke-linecap='round'/><circle cx='57' cy='7' r='5' fill='%23ff9a40'/><circle cx='57' cy='7' r='2.5' fill='%23fff3c0'/></svg>">
<title>Kingdom of Kaboom — Support Guild Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@500;700;800&family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { --gold: #e8c170; --gold-d: #9a6a2a; --ink: #f6e7c8; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; overflow: hidden; background: #1a120c; color: var(--ink); font-family: 'Alegreya Sans', system-ui, sans-serif; user-select: none; }
  canvas { display: block; }
  .panel { background: linear-gradient(180deg, rgba(56, 36, 21, .9), rgba(30, 19, 11, .92)); border: 2px solid var(--gold-d); border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .5), inset 0 0 0 1px rgba(255, 220, 150, .18), inset 0 0 24px rgba(0, 0, 0, .5); }

  #board { position: fixed; top: 20px; right: 20px; width: 270px; padding: 12px 12px 10px; }
  #board h3 { margin: 0 4px 8px; padding-bottom: 8px; border-bottom: 1px solid rgba(232, 193, 112, .3); font: 700 14px 'Cinzel'; letter-spacing: .16em;
    color: var(--gold); display: flex; justify-content: space-between; text-shadow: 0 2px 0 #000; }
  #board h3 span:last-child { letter-spacing: .04em; white-space: nowrap; }
  .row { display: flex; align-items: center; gap: 10px; padding: 5px 8px; border-radius: 6px; font-size: 19px; font-weight: 800; transition: opacity .4s; }
  .row.me { background: linear-gradient(90deg, rgba(232, 193, 112, .22), transparent); }
  .row.dead { opacity: .4; }
  .row.dead .n { text-decoration: line-through; }
  .chip { width: 12px; height: 12px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 2px rgba(0, 0, 0, .55), 0 0 8px currentColor; flex: none; }
  .n { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s { font: 900 19px 'Cinzel'; color: var(--gold); text-shadow: 0 2px 0 #000; }

  #feed { position: fixed; top: 20px; left: 20px; display: flex; flex-direction: column; gap: 6px; }
  .kill { padding: 6px 14px; font-size: 18px; font-weight: 800; animation: slide .35s cubic-bezier(.2, 1.4, .4, 1), fade .6s 4.2s forwards; }
  .kill em { font-style: normal; font-weight: 500; color: #ffb36b; margin: 0 6px; }

  #stats { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; padding: 7px; }
  .stat { display: flex; align-items: center; gap: 8px; padding: 4px 14px 4px 6px; font: 900 22px 'Cinzel'; color: var(--gold); border-radius: 8px; background: rgba(0, 0, 0, .25); }
  .stat img { width: 34px; height: 34px; }
  #spec { position: fixed; bottom: 96px; width: 100%; text-align: center; font: 700 16px 'Cinzel'; letter-spacing: .28em; color: #ff9a7a;
    text-shadow: 0 2px 0 #000, 0 0 14px #a00; pointer-events: none; }

  #banner { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
  #banner div { text-align: center; font: 900 clamp(52px, 8vw, 120px)/1.05 'Cinzel Decorative';
    background: linear-gradient(180deg, #fff6d8 10%, #f3cf7a 45%, #b7792a 78%, #6e4212); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 #2a1406) drop-shadow(0 0 30px rgba(255, 170, 60, .55)); animation: pop .55s cubic-bezier(.2, 1.6, .4, 1); }
  #banner small { display: block; font: 700 .22em 'Cinzel'; letter-spacing: .45em; margin-bottom: 10px; }

  #help { position: fixed; bottom: 22px; left: 20px; padding: 8px 12px; font-size: 15px; color: #d8c29a; display: flex; gap: 14px; }
  kbd { display: inline-block; min-width: 24px; padding: 1px 7px; margin-right: 4px; border-radius: 5px; background: #3a2716; border: 1px solid #8a6230;
    border-bottom-width: 3px; color: var(--ink); font: 800 13px 'Alegreya Sans'; text-align: center; }

  #join { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    background: radial-gradient(ellipse at center, rgba(30, 15, 5, .1), rgba(20, 10, 4, .8)); transition: opacity .8s; }
  #join.gone { opacity: 0; pointer-events: none; }
  .logo { text-align: center; font: 900 clamp(64px, 11vw, 160px)/.9 'Cinzel Decorative';
    background: linear-gradient(180deg, #fff6d8 10%, #f3cf7a 45%, #b7792a 75%, #6e4212); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 0 #2a1406) drop-shadow(0 0 40px rgba(255, 170, 60, .5)); animation: float 4s ease-in-out infinite; }
  .logo small { display: block; font: 700 .3em 'Cinzel'; letter-spacing: .35em; margin-bottom: 6px; }
  .tag { font: 700 17px 'Cinzel'; letter-spacing: .45em; color: #f3dca8; text-shadow: 0 2px 0 #000, 0 0 16px rgba(255, 180, 80, .6); }
  #join form { display: flex; gap: 10px; padding: 10px; margin: 30px 0 16px; }
  #join input { width: 270px; padding: 11px 16px; border-radius: 6px; border: 2px solid var(--gold-d); outline: none;
    background: linear-gradient(180deg, #f6e7c4, #e6cf9c); color: #3a2410; font: 800 22px 'Alegreya Sans'; box-shadow: inset 0 2px 6px rgba(80, 40, 0, .35); }
  #join input::placeholder { color: #8a6a45; }
  #join input:focus { border-color: var(--gold); box-shadow: inset 0 2px 6px rgba(80, 40, 0, .35), 0 0 0 3px rgba(232, 193, 112, .35); }
  #join button { padding: 0 26px; border: 2px solid #7a4a14; border-radius: 6px; cursor: pointer; color: #2a1406; font: 900 18px 'Cinzel'; letter-spacing: .1em;
    background: linear-gradient(180deg, #ffe7a0, #d19a3a); box-shadow: 0 5px 0 #7a4a14, 0 0 30px rgba(255, 190, 80, .45); transition: transform .1s, box-shadow .1s; }
  #join button:hover { transform: translateY(-2px); }
  #join button:active { transform: translateY(4px); box-shadow: 0 1px 0 #7a4a14, 0 0 20px rgba(255, 190, 80, .45); }
  .foes { display: flex; align-items: center; gap: 8px; margin: -4px 0 14px; font: 700 15px 'Cinzel'; letter-spacing: .2em; color: #e0cda6; text-shadow: 0 1px 0 #000; }
  .foes span { margin-right: 6px; }
  .foes button { width: 42px; height: 36px; border: 2px solid var(--gold-d); border-radius: 6px; cursor: pointer; background: rgba(40, 24, 12, .85); color: var(--ink); font: 900 16px 'Cinzel'; }
  .foes button.on { background: linear-gradient(180deg, #ffe7a0, #d19a3a); color: #2a1406; border-color: #7a4a14; }
  .keys { display: flex; gap: 22px; font-size: 16px; color: #e0cda6; text-shadow: 0 1px 0 #000; }

  @keyframes pop { 0% { transform: scale(.3); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } }
  @keyframes slide { from { transform: translateX(-40px); opacity: 0; } }
  @keyframes fade { to { transform: translateX(-20px); opacity: 0; } }
  @keyframes float { 50% { transform: translateY(-10px); } }
</style>
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }</script>
</head>
<body>
<div id="feed"></div>
<div id="board" class="panel"><h3><span>CHAMPIONS</span><span id="roundNo"></span></h3><div id="rows"></div></div>
<div id="stats" class="panel" hidden></div>
<div id="spec" hidden>FALLEN — AWAITING NEXT ROUND</div>
<div id="banner"></div>
<div id="help" class="panel" hidden><span><kbd>WASD</kbd>move</span><span><kbd>SPACE</kbd>bomb</span><span><kbd>M</kbd>mute</span></div>
<div id="join">
  <div class="logo"><small>KINGDOM OF</small>KABOOM</div>
  <div class="tag">⚔ SUPPORT GUILD EDITION ⚔</div>
  <form class="panel"><input id="name" placeholder="Thy name, hero" maxlength="16" required autofocus autocomplete="off"><button>TO BATTLE</button></form>
  <div class="foes" id="foes"><span>OPPONENTS</span><button type="button" data-n="1">1</button><button type="button" data-n="2" class="on">2</button><button type="button" data-n="3">3</button></div>
  <div class="keys"><span><kbd>WASD</kbd><kbd>↑↓←→</kbd>move</span><span><kbd>SPACE</kbd>drop bomb</span><span><kbd>M</kbd>mute</span></div>
</div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Game, botThink } from './game.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { clone as cloneSkinned } from 'three/addons/utils/SkeletonUtils.js';

const W = 15, H = 13, CX = (W - 1) / 2, CZ = (H - 1) / 2;
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const esc = s => s.replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const easeOutBack = k => 1 + 2.7 * (k - 1) ** 3 + 1.7 * (k - 1) ** 2;
const hdr = (hex, k) => new THREE.Color(hex).multiplyScalar(k);
await document.fonts.load('700 60px Cinzel').catch(() => {});

// ---------- renderer / post ----------
const renderer = new THREE.WebGLRenderer({ powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .9;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog('#0b0a14', 28, 80);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.15;
const camera = new THREE.PerspectiveCamera(40, 1, 0.5, 300);

const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(1, 1), 0.55, 0.45, 0.9));
composer.addPass(new OutputPass());

function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
const glowTex = canvasTex(64, 64, g => {
  const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, '#fff'); r.addColorStop(.3, 'rgba(255,255,255,.5)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 64, 64);
});

// ---------- lights ----------
scene.add(new THREE.HemisphereLight('#3a4a7a', '#1a1014', 0.3));
const sun = new THREE.DirectionalLight('#8fa8ff', 0.8); // moonlight
sun.position.set(CX + 6, 14, CZ - 8);
sun.target.position.set(CX, 0, CZ);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
Object.assign(sun.shadow.camera, { left: -13, right: 13, top: 13, bottom: -13, near: 1, far: 50 });
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun, sun.target);
const flashes = Array.from({ length: 4 }, () => { // fixed pool: changing light count recompiles shaders
  const l = new THREE.PointLight('#ff8a3a', 0, 7, 1.6);
  scene.add(l);
  return l;
});
function flash(x, z, i = 10, color = '#ff8a3a') {
  const l = flashes.reduce((a, b) => (a.intensity < b.intensity ? a : b));
  l.position.set(x, 1.2, z);
  l.color.set(color);
  l.intensity = i;
}

// ---------- world ----------
const sky = new THREE.Mesh(new THREE.SphereGeometry(120, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: { top: { value: new THREE.Color('#05060f') }, mid: { value: new THREE.Color('#1a1030') }, bot: { value: new THREE.Color('#0b0a14') } },
  vertexShader: 'varying vec3 v; void main() { v = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',
  fragmentShader: 'uniform vec3 top, mid, bot; varying vec3 v; void main() { vec3 c = v.y > 0. ? mix(mid, top, pow(v.y, .45)) : bot; gl_FragColor = vec4(c, 1.); }',
}));
sky.position.set(CX, 0, CZ);
scene.add(sky);
const starGeo = new THREE.BufferGeometry().setFromPoints(Array.from({ length: 900 }, () =>
  new THREE.Vector3().setFromSphericalCoords(100, Math.acos(Math.random() * .95), rnd(0, Math.PI * 2)).add(sky.position)));
const moon = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: new THREE.Color(1.6, 1.8, 2.4), fog: false, depthWrite: false }));
moon.position.set(CX + 40, 55, CZ - 70);
moon.scale.setScalar(22);
scene.add(moon, new THREE.Points(starGeo, new THREE.PointsMaterial({ size: 1.5, sizeAttenuation: false, color: '#c8d0ff', fog: false })));

const metal = (color, rough = .35) => new THREE.MeshStandardMaterial({ color, metalness: .8, roughness: rough });
const neon = (hex, k = 3) => new THREE.MeshBasicMaterial({ color: hdr(hex, k) });
function add(o, x, y, z, parent = scene) {
  o.position.set(x, y, z);
  o.traverse(m => { m.castShadow = m.receiveShadow = true; });
  parent.add(o);
  return o;
}
const box = (w, h, d, mat) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
const repeat = (tex, x, y) => { const t = tex.clone(); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(x, y); t.needsUpdate = true; return t; };

const grassTex = canvasTex(256, 256, (g, w) => {
  g.fillStyle = '#26361c'; g.fillRect(0, 0, w, w);
  for (let i = 0; i < 4000; i++) {
    g.fillStyle = `hsl(${rnd(75, 110)}, ${rnd(25, 40)}%, ${rnd(10, 22)}%)`;
    g.fillRect(rnd(0, w), rnd(0, w), 2, rnd(2, 6));
  }
});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(260, 260), new THREE.MeshStandardMaterial({ map: repeat(grassTex, 50, 50), roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.position.set(CX, -1.2, CZ);
ground.receiveShadow = true;
scene.add(ground);

const stoneTex = canvasTex(256, 256, g => {
  g.fillStyle = '#4a463e'; g.fillRect(0, 0, 256, 256);
  for (let r = 0; r < 4; r++) for (let c = -1; c < 2; c++) {
    const x = c * 128 + (r % 2) * 64 + 3, y = r * 64 + 3;
    g.fillStyle = `hsl(${rnd(30, 45)}, ${rnd(5, 12)}%, ${rnd(40, 56)}%)`;
    g.beginPath(); g.roundRect(x, y, 122, 58, 6); g.fill();
    for (let i = 0; i < 60; i++) { g.fillStyle = `rgba(${Math.random() < .5 ? '0,0,0' : '255,255,255'},.06)`; g.fillRect(x + rnd(0, 118), y + rnd(0, 54), 4, 4); }
    if (Math.random() < .3) { g.fillStyle = 'rgba(70,110,40,.55)'; g.beginPath(); g.ellipse(x + rnd(10, 110), y + 56, rnd(10, 26), 7, 0, 0, 7); g.fill(); }
  }
});
const stone = (rx = 1, ry = 1) => new THREE.MeshStandardMaterial({ map: repeat(stoneTex, rx, ry), bumpMap: repeat(stoneTex, rx, ry), bumpScale: 2, roughness: .9 });
add(box(W + .8, 1.2, H + .8, stone(6, 1)), CX, -.62, CZ); // top sits just below the floor plane to avoid z-fighting

// Flagstone floor: one irregular slab per tile, drawn twice (color + height) from the same shapes.
const TS = 128;
const slabs = [];
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const x0 = x * TS, y0 = y * TS, m = 5, pts = [];
  const corners = [[x0 + m, y0 + m], [x0 + TS - m, y0 + m], [x0 + TS - m, y0 + TS - m], [x0 + m, y0 + TS - m]];
  corners.forEach(([cx, cy], i) => {
    const [nx, ny] = corners[(i + 1) % 4], chip = rnd(4, 11);
    const dx = Math.sign(nx - cx), dy = Math.sign(ny - cy);
    pts.push([cx + dx * chip, cy + dy * chip]); // chipped corner
    for (const t of [.33, .66]) pts.push([cx + (nx - cx) * t + dy * rnd(-2.5, 2.5), cy + (ny - cy) * t - dx * rnd(-2.5, 2.5)]);
    pts.push([nx - dx * chip, ny - dy * chip]);
  });
  slabs.push({ pts, x0, y0, h: rnd(30, 42), s: rnd(12, 22), l: rnd(45, 55) + ((x + y) % 2) * 3, crack: Math.random() < .3, moss: Math.random() < .3 });
}
const slabPath = (g, pts) => { g.beginPath(); pts.forEach(([x, y]) => g.lineTo(x, y)); g.closePath(); };
const crackLine = (g, s) => {
  g.beginPath();
  let cx = s.x0 + rnd(20, TS - 20), cy = s.y0 + 8;
  g.moveTo(cx, cy);
  for (let i = 0; i < 6; i++) g.lineTo(cx += rnd(-12, 12), cy += rnd(10, 22));
  g.stroke();
};
const floorMap = canvasTex(W * TS, H * TS, g => {
  g.fillStyle = '#2b2720'; g.fillRect(0, 0, W * TS, H * TS);
  for (let i = 0; i < 6000; i++) { g.fillStyle = Math.random() < .5 ? 'rgba(70,95,40,.5)' : 'rgba(20,16,12,.5)'; g.fillRect(rnd(0, W * TS), rnd(0, H * TS), 3, 3); }
  for (const s of slabs) {
    g.save();
    slabPath(g, s.pts); g.clip();
    g.fillStyle = `hsl(${s.h}, ${s.s}%, ${s.l}%)`; g.fillRect(s.x0, s.y0, TS, TS);
    for (let i = 0; i < 5; i++) { // weathering blotches
      const bx = s.x0 + rnd(0, TS), by = s.y0 + rnd(0, TS), r = rnd(15, 45), b = g.createRadialGradient(bx, by, 0, bx, by, r);
      b.addColorStop(0, Math.random() < .5 ? 'rgba(255,240,210,.12)' : 'rgba(30,20,10,.14)'); b.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = b; g.fillRect(bx - r, by - r, r * 2, r * 2);
    }
    for (let i = 0; i < 400; i++) { g.fillStyle = Math.random() < .5 ? 'rgba(0,0,0,.1)' : 'rgba(255,255,255,.08)'; g.fillRect(s.x0 + rnd(0, TS), s.y0 + rnd(0, TS), rnd(1, 3), rnd(1, 3)); }
    if (s.moss) {
      const mx = s.x0 + (Math.random() < .5 ? 8 : TS - 8), my = s.y0 + rnd(10, TS - 10), b = g.createRadialGradient(mx, my, 0, mx, my, 30);
      b.addColorStop(0, 'rgba(85,120,45,.65)'); b.addColorStop(1, 'rgba(85,120,45,0)');
      g.fillStyle = b; g.fillRect(mx - 30, my - 30, 60, 60);
    }
    if (s.crack) { g.strokeStyle = 'rgba(20,14,8,.6)'; g.lineWidth = 1.5; crackLine(g, s); }
    slabPath(g, s.pts);
    g.strokeStyle = 'rgba(0,0,0,.28)'; g.lineWidth = 10; g.stroke(); // darkened rim
    g.translate(-2, -2); slabPath(g, s.pts);
    g.strokeStyle = 'rgba(255,245,225,.1)'; g.lineWidth = 4; g.stroke(); // lit top-left edge
    g.restore();
  }
});
const floorBump = canvasTex(W * TS, H * TS, g => {
  g.fillStyle = '#000'; g.fillRect(0, 0, W * TS, H * TS);
  g.filter = 'blur(3px)'; // soft bevel on slab edges
  for (const s of slabs) { g.fillStyle = '#c8c8c8'; slabPath(g, s.pts); g.fill(); }
  g.filter = 'none';
  for (let i = 0; i < 40000; i++) { g.fillStyle = `rgba(${Math.random() < .5 ? '0,0,0' : '255,255,255'},.12)`; g.fillRect(rnd(0, W * TS), rnd(0, H * TS), 2, 2); }
  g.strokeStyle = '#000'; g.lineWidth = 2;
  for (const s of slabs) if (s.crack) { g.save(); slabPath(g, s.pts); g.clip(); crackLine(g, s); g.restore(); }
}, false);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, H), new THREE.MeshStandardMaterial({ map: floorMap, bumpMap: floorBump, bumpScale: 4, roughness: .85 }));
floor.rotation.x = -Math.PI / 2;
floor.position.set(CX, 0, CZ);
floor.receiveShadow = true;
scene.add(floor);

// Walls never change, so build them once as instanced meshes.
const border = [], merlons = [];
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  if (x === 0 || y === 0 || x === W - 1 || y === H - 1) {
    border.push([x, y]);
    if (y !== H - 1) merlons.push([x + (x === 0 ? -.22 : x === W - 1 ? .22 : 0), y + (y === 0 ? -.22 : 0)]); // none on the front wall: keeps the bottom row visible
  }
}
function instanced(geo, mat, cells, y, shadow = true, base = 0) {
  const m = new THREE.InstancedMesh(geo, mat, cells.length), o = new THREE.Object3D();

function particles(max, blending, order) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(max * 3), col = new Float32Array(max * 4), size = new Float32Array(max);
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color4', new THREE.BufferAttribute(col, 4));
  geo.setAttribute('size', new THREE.BufferAttribute(size, 1));
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending, uniforms: { scale: { value: 1 } },
    vertexShader: `attribute vec4 color4; attribute float size; uniform float scale; varying vec4 c;
      void main() { c = color4; vec4 mv = modelViewMatrix * vec4(position, 1.); gl_PointSize = size * scale / -mv.z; gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `varying vec4 c; void main() { float a = smoothstep(1., 0., length(gl_PointCoord - .5) * 2.); gl_FragColor = vec4(c.rgb, c.a * a * a); }`,
  });
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  pts.renderOrder = order;
  scene.add(pts);
  const list = [];
  return {
    mat,
    emit(p) { if (list.length < max) list.push(p); },
    update(dt) {
      let n = 0;
      for (let i = list.length; i--;) {

        const k = p.age / p.life, d = Math.exp(-p.drag * dt);
        p.vy += p.g * dt;
        p.vx *= d; p.vy *= d; p.vz *= d;
        p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
        pos[n * 3] = p.x; pos[n * 3 + 1] = p.y; pos[n * 3 + 2] = p.z;
        for (let j = 0; j < 3; j++) col[n * 4 + j] = p.c0[j] + (p.c1[j] - p.c0[j]) * k;
        col[n * 4 + 3] = p.a * (1 - k) * Math.min(1, k * 10);
        size[n++] = p.s0 + (p.s1 - p.s0) * k;

}

    if (!o) map.set(k, o = make(it));

function updateCamera(dt) {
  const fit = Math.max(1, 1.5 / camera.aspect); // pull back on narrow screens
  orbit.set(CX + Math.sin(time * .12) * 19, 10, CZ + Math.cos(time * .12) * 19);
  gameCam.set(CX + Math.sin(time * .25) * .25, 15.5 * fit, CZ + 10.6 * fit);
  if (joined) camBlend = Math.min(1, camBlend + dt * .6);
  const k = camBlend * camBlend * (3 - 2 * camBlend);
  camera.position.lerpVectors(orbit, gameCam, k);
  shake *= Math.exp(-dt * 6);
  camera.position.x += rnd(-1, 1) * shake * .3;
  camera.position.y += rnd(-1, 1) * shake * .3;
  camera.lookAt(CX, 0, CZ + .7 * k);
}

let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  time += dt;

  for (const g of players.values()) {
    const u = g.userData;
    if (u.tx === undefined) continue;
    let tx = u.tx, ty = u.ty;
    const moving = !!u.m;
    if (moving) { // dead-reckon between 30Hz snapshots, never past a center the server will stop at
      const [dx, dy] = DIRV[u.m], cx = Math.round(tx), cy = Math.round(ty);
      let ahead = Math.min(time - u.recv, .05) / u.delay;
      const dist = Math.abs(tx - cx) + Math.abs(ty - cy) < 1e-3 ? 1 : dx > 0 ? Math.ceil(tx) - tx : dx < 0 ? tx - Math.floor(tx) : dy > 0 ? Math.ceil(ty) - ty : ty - Math.floor(ty);
      const nx = Math.round(tx + dx * dist), ny = Math.round(ty + dy * dist);
      if (u.d !== u.m || !walkable(nx + dx, ny + dy)) ahead = Math.min(ahead, dist);
      tx += dx * ahead; ty += dy * ahead;
      u.yawT = Math.atan2(dx, dy);
    } else if (u.d && u.die < 0) u.yawT = Math.atan2(...DIRV[u.d]); // blocked (e.g. a wall): still turn to face it
    if (Math.abs(tx - g.position.x) + Math.abs(ty - g.position.z) > 1.5) g.position.set(tx, 0, ty);
    else { const k = 1 - Math.exp(-dt * 20); g.position.x += (tx - g.position.x) * k; g.position.z += (ty - g.position.z) * k; }
    const dy = Math.atan2(Math.sin(u.yawT - u.yaw), Math.cos(u.yawT - u.yaw));
    u.yaw += dy * Math.min(1, dt * 14);
    let y = 0;
    if (u.drop > 0) {
      u.drop = Math.max(0, u.drop - dt * 1.6);
      y = u.drop * u.drop * 7;
      if (!u.drop) {
        smokePuff(g.position.x, .1, g.position.z, 8, [.25, .22, .2], .4, .5);
        if (play(u, 'Jump_Land')) u.landT = .45;
      }
    }
    if (u.die >= 0) {
      u.die += dt;
      play(u, 'Death_A');
      u.tag.visible = false;
      if (u.die > .9) { // after falling, dissolve into rising motes
        if (!u.fadeMats) { // own copies: model materials are shared with every hero of the same class
          u.fadeMats = [];
          u.rig.traverse(o => { if (o.isMesh) u.fadeMats.push(o.material = o.material.clone()); });
        }
        const k = Math.min(1, (u.die - .9) / .9);
        for (const m of u.fadeMats) {
          if (!m.transparent) { m.transparent = true; m.needsUpdate = true; } // transparent changes the compiled shader
          m.opacity = 1 - k;
        }
        const c = new THREE.Color(u.color).multiplyScalar(2.5).toArray();
        for (let i = 0; i < (k < 1 ? 5 : 0); i++) {
          const p = u.bones?.length ? u.bones[Math.floor(Math.random() * u.bones.length)].getWorldPosition(tmpV) : tmpV.copy(g.position).setY(.3);
          fx.emit(P(p.x + rnd(-.15, .15), p.y + rnd(-.1, .1), p.z + rnd(-.15, .15), {
          vx: rnd(-.15, .15), vy: rnd(.6, 1.5), vz: rnd(-.15, .15), drag: .6, life: rnd(.8, 1.4), c0: Math.random() < .3 ? [2, 2, 2.2] : c, c1: [.4, .4, .6], s0: rnd(.08, .16), s1: .03 }));
        }
      }
      if (u.die > 1.9) { g.visible = false; u.die = -1; }
    } else {
      u.tag.visible = true;
      if ((u.landT -= dt) > 0) {} // let the landing play out
      else play(u, u.cheer ? 'Cheer' : moving ? 'Running_A' : 'Idle');
      if (u.actions) u.actions.Running_A.timeScale = .2 / u.delay; // faster runners animate faster
    }
    u.mixer?.update(dt);
    u.rig.position.y = y;
    u.rig.rotation.y = u.yaw;
    if (u.ring) { u.ring.visible = u.die < 0; u.ring.rotation.y = time * .8; u.ring.material.opacity = .7 + Math.sin(time * 4) * .25; }
    if (moving && g.visible && Math.random() < dt * 8) smokePuff(g.position.x, .05, g.position.z, 1, [.25, .22, .2], .25, .1);
  }
  for (const g of bombs.values()) {
    const u = g.userData, urgency = 1 - Math.max(0, (u.t -= dt) / 2.5), p = .5 + .5 * Math.sin(time * (8 + urgency * 30));
    const pop = Math.min(1, (time - u.born) / .3);
    u.mat.emissiveIntensity = urgency * urgency * p * 5;
    u.pulse.scale.set(1, 1, 1).multiplyScalar(easeOutBack(pop) * (1 + urgency * .1 * p));
    u.spark.scale.setScalar(rnd(.25, .5));
    if (Math.random() < .5) sparks(g.position.x + fuseTip.x, fuseTip.y, g.position.z + fuseTip.z, 1, [8, 5, 1.8], 1.5);
  }
  for (const m of flames.values()) {
    const k = Math.min(1, (time - m.userData.born) / .3); // matches the server's deadly window
    m.scale.setScalar((.7 + Math.sin(time * 40 + m.position.x) * .12) * (1 - k * .5));
    m.material.opacity = 1 - k;
    if (Math.random() < .3) fire(m.position.x, .2, m.position.z, 1, .6);
  }
  for (const g of items.values()) {
    const u = g.userData;
    u.spin.rotation.y = time * 2.5;
    u.spin.position.y = .5 + Math.sin(time * 3 + u.phase) * .07;
  }
  for (const m of walls.values()) { // walls rise out of the floor at round start
    if (m.userData.rise === undefined) continue;
    const k = Math.max(0, Math.min(1, (time - m.userData.rise) / .5));
    m.position.y = -.52 + easeOutBack(k) * 1.02;
    if (k === 1) delete m.userData.rise;
  }
  for (const m of crates.values()) {
    if (m.userData.born === undefined) continue;
    const k = Math.max(0, Math.min(1, (time - m.userData.born) / .45));
    m.scale.setScalar(Math.max(.001, easeOutBack(k)));
    if (k === 1) delete m.userData.born;
  }
  for (let i = chunks.length; i--;) {
    const c = chunks[i];
    if ((c.age += dt) > c.life) { chunks[i] = chunks[chunks.length - 1]; chunks.pop(); continue; }
    c.v.y -= 14 * dt;
    c.p.addScaledVector(c.v, dt);
    if (c.p.y < .065) { c.p.y = .065; c.v.y *= -.35; c.v.x *= .6; c.v.z *= .6; c.rv.multiplyScalar(.6); }
    c.r.x += c.rv.x * dt; c.r.y += c.rv.y * dt; c.r.z += c.rv.z * dt;
  }
  chunks.forEach((c, i) => {
    dummy.position.copy(c.p);
    dummy.rotation.copy(c.r);
    dummy.scale.setScalar(c.s * Math.min(1, (c.life - c.age) * 2));
    dummy.updateMatrix();
    debrisMesh.setMatrixAt(i, dummy.matrix);
  });
  debrisMesh.count = chunks.length;
  debrisMesh.instanceMatrix.needsUpdate = true;
  for (let i = transients.length; i--;) {
    const t = transients[i];
    const k = (t.age += dt) / t.life;
    if (k < 1) { t.update(t.obj, k); continue; }
    scene.remove(t.obj);
    t.obj.material.dispose();
    transients.splice(i, 1);
  }
  if (Math.random() < dt * 25) { // fireflies
    const c = Math.random() < .5 ? [.6, 1.4, 2.4] : [2.4, 1.6, .5];
    fx.emit(P(rnd(-4, W + 3), rnd(.3, 2.5), rnd(-4, H + 3), { vx: rnd(-.4, .4), vy: rnd(-.1, .2), vz: rnd(-.4, .4), life: rnd(3, 6), c0: c, c1: c, s0: .1, s1: .06, a: .9 }));
  }
  rippleTex.offset.set(time * .02, time * .013);
  for (const m of mists) {
    const u = m.userData;
    u.a += u.w * dt;
    m.position.set(CX + Math.cos(u.a) * u.r * 1.2, -.7, CZ + Math.sin(u.a) * u.r);
  }
  for (const c of chimneys) if (Math.random() < .08) smoke.emit(P(c.x, c.y, c.z, { vx: rnd(.05, .2), vy: rnd(.4, .7), vz: rnd(-.05, .05), drag: .5, life: rnd(2.5, 4), c0: [.1, .1, .12], c1: [.1, .1, .12], s0: .3, s1: 1.4, a: .35 }));
  torches.forEach(t => {
    const k = time + t.seed, f = Math.sin(k * 7) * .5 + Math.sin(k * 11.3) * .3 + Math.sin(k * 23.7) * .2; // layered sines: lively but smooth
    t.light.intensity = t.base + f * .5;
    t.glow.scale.setScalar(.85 + f * .08);
    t.flame.scale.set(t.size * (1 - f * .06), t.size * (1 + f * .18), t.size * (1 - f * .06));
    t.flame.rotation.set(Math.sin(k * 3.1) * .12, 0, Math.sin(k * 2.3) * .12); // sway
    if (Math.random() < .5 * t.size) fx.emit(P(t.x + rnd(-.03, .03) * t.size, t.top, t.z + rnd(-.03, .03) * t.size, { // embers off the tip
      vx: rnd(-.15, .15), vy: rnd(.5, 1.1), vz: rnd(-.15, .15), drag: 1, life: rnd(.35, .7), c0: [3, 1.4, .35], c1: [.8, .15, 0], s0: rnd(.08, .16), s1: .03 }));
    if (Math.random() < .1) smoke.emit(P(t.x, t.top + .13, t.z, { vx: rnd(-.1, .1), vy: rnd(.4, .8), vz: rnd(-.1, .1), drag: .8, life: rnd(1, 1.6), c0: [.08, .07, .07], c1: [.08, .07, .07], s0: .15, s1: .6, a: .3 })); // thin smoke wisps
  });
  for (const l of flashes) l.intensity *= Math.exp(-dt * 8);
  smoke.update(dt);
  fx.update(dt);
  updateCamera(dt);
  composer.render(dt);
});
</script>
